name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端冒烟测试 (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements-test.txt
      - name: 运行 V3 冒烟测试
        run: python tests/smoke_test_v3.py
      - name: 运行 V4 冒烟测试
        run: python tests/smoke_test_v4.py

  frontend:
    name: 前端生产构建 (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
